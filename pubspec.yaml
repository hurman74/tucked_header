name: tucked_header
description: >-
  Start a sliver header hidden or collapsed above the fold, measured during layout, so no height guess. Keeps content steady on resize; snap and controller.
version: 0.1.0
repository: https://github.com/hurman74/tucked_header
issue_tracker: https://github.com/hurman74/tucked_header/issues

screenshots:
  - description: A search field tucked above an inbox, revealed by pulling down or by a button.
    path: doc/demo.gif
  - description: A guessed initialScrollOffset leaves part of the header showing; SliverTucked measures it.
    path: doc/comparison.png

topics:
  - sliver
  - scrolling
  - widget
  - ui

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
