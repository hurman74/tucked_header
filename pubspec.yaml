name: tucked_header
description: >-
  Start a sliver header collapsed or hidden above the fold, even when its height is only known after layout. Keeps content steady when it resizes, with snapping and a reveal/tuck controller.
version: 0.1.0
repository: https://github.com/hurman74/tucked_header
issue_tracker: https://github.com/hurman74/tucked_header/issues

topics:
  - sliver
  - scrolling
  - widget
  - ui

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
