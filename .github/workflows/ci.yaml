name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the latest stable release.
        flutter-version: ["3.32.0", "any"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - name: Check formatting
        if: matrix.flutter-version == 'any'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: flutter test
      - run: flutter test
        working-directory: example
      - name: Summarize failure
        if: failure()
        run: |
          echo "Error: failed on Flutter ${{ matrix.flutter-version }}"
          dart format --output=none --set-exit-if-changed . 2>&1 | grep Changed | sed 's/^/Error: format: /' || true
          flutter test -r expanded 2>&1 | grep -E 'EXCEPTION|\[E\]|timed out|Test failed|^(The|A|Expected|Actual)' | head -15 | sed 's/^/Error: test: /' || true
          cd example
          flutter test -r expanded 2>&1 | grep -E 'EXCEPTION|\[E\]|timed out|Test failed|^(The|A|Expected|Actual)' | head -10 | sed 's/^/Error: example: /' || true
          exit 1
